<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d171b"><link rel="manifest" href="manifest.webmanifest"><title>SpellPilot</title><style>html,body{margin:0;background:#091114;color:#eff8f5;font-family:system-ui}.load{display:grid;place-items:center;min-height:100vh}.box{text-align:center}</style></head><body><div class="load"><div class="box"><h2>✦ SpellPilot</h2><p>Loading…</p></div></div><script>(async()=>{try{let a=(await Promise.all(['p1.txt','p2.txt','p3.txt','p4.txt','p5.txt'].map(x=>fetch(x).then(r=>r.text())))).join('');let u=Uint8Array.from(atob(a),c=>c.charCodeAt(0));let t=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(t);document.close()}catch(e){document.body.innerHTML='<div class="load"><div class="box"><h2>SpellPilot failed to load</h2><p>Refresh and try again.</p></div></div>'}})();</script></body></html>
