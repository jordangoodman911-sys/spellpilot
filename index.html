<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d171b"><link rel="manifest" href="manifest.webmanifest"><title>SpellPilot</title><style>html,body{margin:0;background:#091114;color:#eff8f5;font-family:system-ui}.load{display:grid;place-items:center;min-height:100vh}.box{text-align:center}.spin{font-size:34px}</style></head><body><div class="load"><div class="box"><div class="spin">✦</div><h2>Loading SpellPilot…</h2></div></div><script>(async()=>{try{const f=['app-1.txt','app-2.txt','app-3.txt','app-4.txt','app-5.txt','app-6.txt','app-7.txt','app-8.txt','app-9.txt','app-10.txt','app-11.txt','app-12.txt','app-13.txt','app-14.txt'];const p=await Promise.all(f.map(x=>fetch(x).then(r=>{if(!r.ok)throw Error(x);return r.text()})));document.open();document.write(p.join(''));document.close()}catch(e){document.body.innerHTML='<div class="load"><div class="box"><h2>SpellPilot failed to load</h2><p>Refresh the page and try again.</p></div></div>'}})();</script></body></html>
