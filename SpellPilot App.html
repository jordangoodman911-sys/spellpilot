<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d171b"><title>SpellPilot App</title><style>html,body{margin:0;background:#091114;color:#eff8f5;font-family:system-ui}.load{display:grid;place-items:center;min-height:100vh}.box{text-align:center}.muted{color:#8fb0a8;font-size:14px}</style></head><body><div class="load"><div class="box"><h2>✦ SpellPilot</h2><p>Loading v1.5…</p><p class="muted">Combat/rules update</p></div></div><script src="v15-1.js?v=15b"></script><script src="v15-2.js?v=15b"></script><script src="v15-3.js?v=15b"></script><script src="v15-4.js?v=15b"></script><script src="v15-5.js?v=15b"></script><script src="v15-6.js?v=15b"></script><script src="v15-7.js?v=15b"></script><script src="v15-8.js?v=15b"></script><script>async function startSpellPilot(){try{if(!window.__sp)throw Error('App data missing');const u=Uint8Array.from(atob(window.__sp),c=>c.charCodeAt(0));let t='';try{if(!('DecompressionStream' in window))throw Error('no native gzip');t=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text()}catch(nativeErr){await new Promise((ok,bad)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js';s.onload=ok;s.onerror=()=>bad(Error('Could not load gzip fallback'));document.head.appendChild(s)});t=new TextDecoder().decode(window.pako.ungzip(u))}if(!t.includes('SPELLPILOT v1.5 READY'))throw Error('App package did not validate');document.open();document.write(t);document.close()}catch(e){document.body.innerHTML='<div class="load"><div class="box"><h2>SpellPilot could not start</h2><p>'+e.message+'</p><p class="muted">Please hard refresh once. If using the downloaded ZIP, redownload it so all v1.5 files match.</p></div></div>'}}startSpellPilot();</script></body></html>
