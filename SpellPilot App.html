<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d171b"><title>SpellPilot App</title><style>html,body{margin:0;background:#091114;color:#eff8f5;font-family:system-ui}.load{display:grid;place-items:center;min-height:100vh}.box{text-align:center}.muted{color:#8fb0a8;font-size:14px}</style></head><body><div class="load"><div class="box"><h2>✦ SpellPilot</h2><p>Loading v1.5…</p><p class="muted">This is the file to double-click after downloading the ZIP.</p></div></div><script src="v15-1.js"></script><script src="v15-2.js"></script><script src="v15-3.js"></script><script src="v15-4.js"></script><script src="v15-5.js"></script><script src="v15-6.js"></script><script src="v15-7.js"></script><script src="v15-8.js"></script><script>(async()=>{try{if(!window.__sp)throw Error('App data missing');if(!('DecompressionStream' in window))throw Error('This browser needs a newer Chrome, Edge or Opera version.');const u=Uint8Array.from(atob(window.__sp),c=>c.charCodeAt(0));const t=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(t);document.close()}catch(e){document.body.innerHTML='<div class="load"><div class="box"><h2>SpellPilot could not start</h2><p>'+e.message+'</p><p class="muted">Keep SpellPilot App.html and v15-1.js through v15-8.js together in the same folder.</p></div></div>'}})();</script></body></html>
